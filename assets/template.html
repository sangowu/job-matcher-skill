<!DOCTYPE html>
<html lang="__LANG__" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Matcher Report</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<style>
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
  .dark ::-webkit-scrollbar-thumb { background: #475569; }
  .card-enter { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .job-card.selected { box-shadow: inset 3px 0 0 0 #3b82f6; }
</style>
</head>
<body class="h-screen flex flex-col bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans overflow-hidden transition-colors">

<!-- 顶部（全宽）-->
<header class="flex-shrink-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shadow-sm px-4 py-3">
  <div class="flex items-center gap-3 flex-wrap">
    <span class="text-lg font-bold text-blue-600 dark:text-blue-400">Job Matcher</span>
    <span id="summary" class="text-xs text-gray-500 dark:text-gray-400"></span>
    <div class="ml-auto flex items-center gap-2">
      <button id="health-btn" type="button" aria-haspopup="dialog"
        class="inline-flex items-center gap-1.5 text-xs px-2 py-1 rounded-md border transition-colors">
        <span id="health-dot" class="w-2 h-2 rounded-full" aria-hidden="true"></span>
        <span id="health-label"></span>
      </button>
      <button id="lang-btn" class="text-xs px-2 py-1 rounded-md bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600"></button>
      <button id="dark-btn" class="text-xs px-2 py-1 rounded-md bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600"></button>
    </div>
  </div>
  <p id="profile-line" class="text-xs text-gray-400 dark:text-gray-500 mt-1"></p>
  <div id="run-context" class="mt-2 flex flex-wrap gap-1.5"></div>
  <div id="coverage-summary" class="mt-2 hidden grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-4"></div>
</header>

<!-- 两栏：左列表 30% + 右详情 70% -->
<div id="main" class="flex-1 flex overflow-hidden">
  <aside id="list-pane" class="w-[30%] min-w-[280px] flex flex-col border-r border-gray-200 dark:border-gray-700">
    <!-- 列表控件（搜索 / 排序 / 筛选）-->
    <div class="flex-shrink-0 p-3 border-b border-gray-200 dark:border-gray-700 space-y-2">
      <input id="search" type="text"
        class="w-full pl-3 pr-2 py-1.5 text-sm rounded-md border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-1 focus:ring-blue-400" />
      <div class="flex items-center gap-2">
        <select id="sort" class="flex-1 min-w-0 text-sm px-2 py-1.5 rounded-md border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"></select>
        <select id="score-filter" class="flex-shrink-0 text-sm px-2 py-1.5 rounded-md border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"></select>
      </div>
      <div id="date-filter" class="flex gap-1"></div>
      <div class="grid grid-cols-1 gap-1.5 xl:grid-cols-3">
        <select id="market-filter" class="min-w-0 text-xs px-2 py-1.5 rounded-md border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"></select>
        <select id="source-type-filter" class="min-w-0 text-xs px-2 py-1.5 rounded-md border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"></select>
        <select id="verification-filter" class="min-w-0 text-xs px-2 py-1.5 rounded-md border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"></select>
      </div>
    </div>
    <!-- 列表滚动区 -->
    <div class="flex-1 overflow-y-auto p-3 space-y-4">
    <section id="new-wrap" class="hidden">
      <h2 id="new-title" class="text-xs font-bold text-emerald-600 dark:text-emerald-400 mb-2 px-1"></h2>
      <div id="new-list" class="space-y-2"></div>
    </section>
    <section id="hist-wrap">
      <h2 id="hist-title" class="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 px-1"></h2>
      <div id="hist-list" class="space-y-2"></div>
      <button id="hist-more" class="hidden mt-3 w-full py-2 text-xs text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-md"></button>
    </section>
    <p id="empty" class="hidden text-center text-gray-400 py-16 text-sm"></p>
    </div>
  </aside>

  <main id="detail-pane" class="flex-1 overflow-y-auto p-6">
    <div id="detail-content"></div>
  </main>
</div>

<!-- 运行监控：报告生成时的静态快照，不改变职位浏览主布局 -->
<div id="health-overlay" role="dialog" aria-modal="true" aria-labelledby="health-title"
  class="hidden fixed inset-0 z-50 overflow-y-auto bg-gray-900/95 p-4 sm:p-8">
  <div class="mx-auto max-w-5xl rounded-2xl border border-gray-700 bg-white dark:bg-gray-800 shadow-2xl">
    <div class="flex items-start gap-4 border-b border-gray-200 dark:border-gray-700 p-5 sm:p-6">
      <div class="min-w-0 flex-1">
        <h2 id="health-title" class="text-lg font-bold"></h2>
        <p id="health-subtitle" class="mt-1 text-xs text-gray-500 dark:text-gray-400"></p>
      </div>
      <button id="health-close" type="button" class="rounded-lg bg-gray-100 dark:bg-gray-700 px-3 py-1.5 text-xs hover:bg-gray-200 dark:hover:bg-gray-600"></button>
    </div>
    <div class="space-y-6 p-5 sm:p-6">
      <div id="health-window" class="inline-flex rounded-lg bg-gray-100 dark:bg-gray-900/60 p-1"></div>
      <div id="health-status-card" class="rounded-xl border p-4"></div>
      <section>
        <h3 id="health-kpi-title" class="mb-3 text-sm font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400"></h3>
        <div id="health-kpis" class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4"></div>
      </section>
      <section>
        <h3 id="health-breach-title" class="mb-3 text-sm font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400"></h3>
        <div id="health-breaches" class="space-y-2"></div>
      </section>
      <p id="health-snapshot" class="border-t border-gray-200 dark:border-gray-700 pt-4 text-xs text-gray-400 dark:text-gray-500"></p>
    </div>
  </div>
</div>

// ── 工具 ───────────────────────────────────────────────────────────────────────
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function scoreColor(s) {
  if (s == null) return "bg-gray-400";
  if (s >= 80) return "bg-green-500"; if (s >= 60) return "bg-yellow-400";
  if (s >= 40) return "bg-orange-400"; return "bg-red-400";
}
function scoreBadge(s, big) {
  const d = (s == null) ? "?" : Math.round(s);
  const sz = big ? "w-12 h-12 text-base" : "w-10 h-10 text-sm";
  return `<span class="inline-flex items-center justify-center ${sz} rounded-full text-white font-bold tabular-nums flex-shrink-0 ${scoreColor(s)}">${d}</span>`;
}
function recBadge(rec) {
  if (!rec) return "";
  const cls = {
    strong_apply: "bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-300",
    apply: "bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300",
    stretch_apply: "bg-yellow-100 dark:bg-yellow-900/40 text-yellow-700 dark:text-yellow-300",
    low_priority: "bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300",
    skip: "bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300",
  }[rec] || "bg-gray-100 text-gray-600";
  return `<span class="px-2 py-0.5 rounded-full text-xs font-medium ${cls}">${t("rec_" + rec)}</span>`;
}
function chip(text, cls) { return `<span class="text-xs px-1.5 py-0.5 rounded ${cls}">${esc(text)}</span>`; }
function bullets(arr) {
  if (!arr || !arr.length) return `<p class="text-xs text-gray-400">${t("na")}</p>`;
  return `<ul class="text-xs space-y-1 list-disc list-inside">${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
}
function categoryLabel(prefix, value) {
  return t(`${prefix}_${value || "unknown"}`);
}
function formatRunTime(value) {
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? String(value || "–") : parsed.toLocaleString(LANG === "zh" ? "zh-CN" : "en-IE");
}
function renderRunContext() {
  const items = [];
  const markets = (META.target_markets || []).map(value => categoryLabel("market", value));
  if (markets.length) items.push(t("context_market", markets.join(", ")));
  if ((META.search_languages || []).length) items.push(t("context_search_languages", META.search_languages.join(", ")));
  items.push(t("context_report_language", META.report_language === "zh" ? "zh-Hans" : "en"));
  if (META.run_time) items.push(t("context_run_time", formatRunTime(META.run_time)));
  document.getElementById("run-context").innerHTML = items.map(value =>
    `<span class="rounded-md bg-gray-100 dark:bg-gray-700 px-2 py-1 text-[11px] text-gray-600 dark:text-gray-300">${esc(value)}</span>`
  ).join("");
}
function coverageStyle(status) {
  return {
    executed: "border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-900/20",
    partial: "border-amber-200 dark:border-amber-800 bg-amber-50 dark:bg-amber-900/20",
    failed: "border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-900/20",
    skipped: "border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800",
    not_collected: "border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800",
    unknown: "border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800",
  }[status] || coverageStyle("unknown");
}
function renderCoverage() {
  const rows = Array.isArray(META.market_coverage) ? META.market_coverage : [];
  const container = document.getElementById("coverage-summary");
  if (!rows.length) { container.classList.add("hidden"); return; }
  container.classList.remove("hidden");
  container.classList.add("grid");
  container.innerHTML = rows.map(row => {
    const candidateCount = ["failed", "skipped"].includes(row.status) ? "–" : (row.candidates_incremental ?? 0);

      ? ""
      : `<p class="mt-1 text-[10px] text-gray-500 dark:text-gray-400">${esc(t("coverage_counts", row.sources_succeeded ?? 0, row.sources_planned ?? 0, row.sources_failed ?? 0, row.sources_skipped ?? 0, candidateCount))}</p>`;

  }).join("");
}

function healthStatusText(status) { return t("health_" + status); }
function fmtNumber(value) { return value == null ? "–" : Number(value).toLocaleString(); }
function fmtPercent(value) { return value == null ? "–" : `${(Number(value) * 100).toFixed(1)}%`; }
function fmtMs(value) { return value == null ? "–" : t("health_ms", fmtNumber(value)); }
function fmtMinutes(value) { return value == null ? "–" : t("health_minutes", fmtNumber(value)); }
function formatBreachValue(metric, value) {

// ── 筛选 / 排序 ─────────────────────────────────────────────────────────────────
function withinDate(job) {
  if (dateRange === "all") return true;
  const ds = job.date_posted || job.first_seen;
  if (!ds) return true;
  const d = new Date(ds); if (isNaN(d)) return true;
  const days = (Date.now() - d.getTime()) / 86400000;
  return dateRange === "today" ? days <= 1 : days <= 7;
}
function matches(job) {
  if (searchText) {
    const q = searchText.toLowerCase();
    if (!(job.title || "").toLowerCase().includes(q) && !(job.company || "").toLowerCase().includes(q)) return false;
  }
  if (scoreMin != null && (job.score ?? -1) < scoreMin) return false;
  if (!withinDate(job)) return false;
  if (marketFilter !== "all") {
    const markets = job.market_ids || [];
    if (marketFilter === "unknown" ? markets.length : !markets.includes(marketFilter)) return false;
  }
  if (sourceTypeFilter !== "all" && !(job.source_types || []).includes(sourceTypeFilter)) return false;
  if (verificationFilter !== "all" && !(job.verification_statuses || []).includes(verificationFilter)) return false;
  return true;
}
function sortJobs(list) {
  return [...list].sort((a, b) =>
    sortMode === "score" ? (b.score ?? -1) - (a.score ?? -1)
      : new Date(b.date_posted || b.first_seen || 0) - new Date(a.date_posted || a.first_seen || 0));
}

}

function selectJob(idx) {
  selectedIdx = idx;
  document.querySelectorAll(".job-card").forEach(el => {
    const on = +el.dataset.idx === idx;
    el.classList.toggle("selected", on);
    el.classList.toggle("ring-1", on);
    el.classList.toggle("ring-blue-300", on);
    el.classList.toggle("dark:ring-blue-700", on);
  });
  renderDetail(idx == null ? null : JOBS[idx]);
}

function emptyStateText(filteredCount) {
  if (filteredCount === 0 && JOBS.length) return t("empty_filtered");
  return t("empty_" + (META.empty_state_reason || "not_collected"));
}

// ── 渲染列表 ────────────────────────────────────────────────────────────────────
function renderList() {
  const filtered = sortJobs(JOBS.filter(matches));
  const idxOf = j => JOBS.indexOf(j);
  const news = filtered.filter(j => j.status === "new");
  const hist = filtered.filter(j => j.status !== "new");

  const newWrap = document.getElementById("new-wrap");
  if (news.length) {
    newWrap.classList.remove("hidden");
    document.getElementById("new-title").textContent = t("new_title", news.length);
    document.getElementById("new-list").innerHTML = news.map(j => card(j, idxOf(j))).join("");
  } else {
    newWrap.classList.add("hidden");
    document.getElementById("new-list").innerHTML = "";
  }

  document.getElementById("hist-title").textContent = t("hist_title", hist.length);
  const shown = histExpanded ? hist : hist.slice(0, HIST_LIMIT);
  document.getElementById("hist-list").innerHTML = shown.map(j => card(j, idxOf(j))).join("");
  const moreBtn = document.getElementById("hist-more");
  if (!histExpanded && hist.length > HIST_LIMIT) {
    moreBtn.classList.remove("hidden");
    moreBtn.textContent = t("more", hist.length - HIST_LIMIT);
  } else moreBtn.classList.add("hidden");

  const empty = document.getElementById("empty");
  empty.textContent = emptyStateText(filtered.length);
  empty.classList.toggle("hidden", filtered.length > 0);

  // 选中：保持当前选中（若仍可见），否则选第一个
  const visible = filtered.map(idxOf);
  if (selectedIdx == null || !visible.includes(selectedIdx)) {
    selectJob(visible.length ? visible[0] : null);
  } else {
    selectJob(selectedIdx);
  }
}

// ── 控件 ───────────────────────────────────────────────────────────────────────

  document.getElementById("profile-line").textContent = META.profile_summary ? t("profile", META.profile_summary) : "";
  renderRunContext();
  renderCoverage();
  document.getElementById("search").placeholder = t("search_ph");
  document.getElementById("lang-btn").textContent = t("lang_btn");
  document.getElementById("dark-btn").textContent = document.documentElement.classList.contains("dark") ? t("dark_light") : t("dark_dark");
  const sortSel = document.getElementById("sort");
  sortSel.innerHTML = `<option value="score">${t("sort_score")}</option><option value="date">${t("sort_date")}</option>`;
  sortSel.value = sortMode;
  document.getElementById("date-filter").innerHTML = ["all", "today", "week"].map(r =>

  marketSelect.value = marketFilter;
  const sourceValues = [...new Set(JOBS.flatMap(job => job.source_types || ["unknown"]))].sort();
  const sourceSelect = document.getElementById("source-type-filter");
  sourceSelect.innerHTML = `<option value="all">${t("filter_source_all")}</option>` + sourceValues.map(value => `<option value="${esc(value)}">${esc(categoryLabel("source_type", value))}</option>`).join("");
  sourceSelect.value = sourceTypeFilter;
  const verificationValues = [...new Set(JOBS.flatMap(job => job.verification_statuses || ["unknown"]))].sort();
  const verificationSelect = document.getElementById("verification-filter");
  verificationSelect.innerHTML = `<option value="all">${t("filter_verification_all")}</option>` + verificationValues.map(value => `<option value="${esc(value)}">${esc(categoryLabel("verification", value))}</option>`).join("");

  renderHealthButton();
  if (!document.getElementById("health-overlay").classList.contains("hidden")) renderHealthOverlay();
}
function bind() {
  document.getElementById("search").addEventListener("input", e => { searchText = e.target.value.trim(); renderList(); });
  document.getElementById("sort").addEventListener("change", e => { sortMode = e.target.value; renderList(); });
  document.getElementById("score-filter").addEventListener("change", e => { scoreMin = e.target.value ? +e.target.value : null; renderList(); });
  document.getElementById("market-filter").addEventListener("change", e => { marketFilter = e.target.value; renderList(); });
  document.getElementById("source-type-filter").addEventListener("change", e => { sourceTypeFilter = e.target.value; renderList(); });
  document.getElementById("verification-filter").addEventListener("change", e => { verificationFilter = e.target.value; renderList(); });
  document.getElementById("date-filter").addEventListener("click", e => {
    const b = e.target.closest("[data-r]"); if (!b) return;
    dateRange = b.dataset.r; applyStaticLabels(); renderList();
  });
  document.getElementById("hist-more").addEventListener("click", () => { histExpanded = true; renderList(); });
  document.getElementById("lang-btn").addEventListener("click", () => { LANG = LANG === "zh" ? "en" : "zh"; applyStaticLabels(); renderList(); });
  document.getElementById("health-btn").addEventListener("click", () => {
    document.getElementById("health-overlay").classList.remove("hidden");
    renderHealthOverlay();
  });
  document.getElementById("health-close").addEventListener("click", () => document.getElementById("health-overlay").classList.add("hidden"));
  document.getElementById("health-window").addEventListener("click", e => {
    const button = e.target.closest("[data-health-window]"); if (!button) return;
    healthWindow = button.dataset.healthWindow;
    renderHealthButton(); renderHealthOverlay();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") document.getElementById("health-overlay").classList.add("hidden");
  });
  document.getElementById("dark-btn").addEventListener("click", () => {
    const on = document.documentElement.classList.toggle("dark");
    localStorage.setItem("jm_dark", on ? "1" : "0");
    applyStaticLabels();
  });
}
(function init() {
  const saved = localStorage.getItem("jm_dark");
  if (saved !== null) document.documentElement.classList.toggle("dark", saved === "1");
  if (!["zh", "en"].includes(LANG)) LANG = "en";
  applyStaticLabels(); bind(); renderList();
})();
</script>
</body>
</html>
