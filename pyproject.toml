# Metadata only: this skill is consumed by copying the directory into an
# agent's skills folder, not by installing a wheel, so there is no
# [build-system] table. `version` is the single source of truth -- read at
# runtime by _jobutil.skill_version() and checked against CHANGELOG.md by
# tests/test_version.py.
[project]
name = "job-matcher"
version = "2.3.0"
description = "Agent skill that turns a CV plus job intent into an interactive job-match report."
requires-python = ">=3.10"

[project.optional-dependencies]
remote-browser = ["kernel>=0.94,<1", "keyring"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
