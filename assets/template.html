<!DOCTYPE html>
<html lang="__LANG__" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Matcher Report</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<style>
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
  .dark ::-webkit-scrollbar-thumb { background: #475569; }
  .card-enter { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .job-card.selected { box-shadow: inset 3px 0 0 0 #3b82f6; }
</style>
</head>
<body class="h-screen flex flex-col bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans overflow-hidden transition-colors">

<!-- 顶部（全宽）-->
<header class="flex-shrink-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shadow-sm px-4 py-3">
  <div class="flex items-center gap-3 flex-wrap">
    <span class="text-lg font-bold text-blue-600 dark:text-blue-400">Job Matcher</span>
    <span id="summary" class="text-xs text-gray-500 dark:text-gray-400"></span>
    <div class="ml-auto flex items-center gap-2">
      <button id="health-btn" type="button" aria-haspopup="dialog"
        class="inline-flex items-center gap-1.5 text-xs px-2 py-1 rounded-md border transition-colors">
        <span id="health-dot" class="w-2 h-2 rounded-full" aria-hidden="true"></span>
        <span id="health-label"></span>
      </button>
      <button id="lang-btn" class="text-xs px-2 py-1 rounded-md bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600"></button>
      <button id="dark-btn" class="text-xs px-2 py-1 rounded-md bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600"></button>
    </div>
  </div>
  <p id="profile-line" class="text-xs text-gray-400 dark:text-gray-500 mt-1"></p>
</header>

<!-- 两栏：左列表 30% + 右详情 70% -->
<div id="main" class="flex-1 flex overflow-hidden">
  <aside id="list-pane" class="w-[30%] min-w-[280px] flex flex-col border-r border-gray-200 dark:border-gray-700">
    <!-- 列表控件（搜索 / 排序 / 筛选）-->
    <div class="flex-shrink-0 p-3 border-b border-gray-200 dark:border-gray-700 space-y-2">
      <input id="search" type="text"
        class="w-full pl-3 pr-2 py-1.5 text-sm rounded-md border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-1 focus:ring-blue-400" />
      <div class="flex items-center gap-2">
        <select id="sort" class="flex-1 min-w-0 text-sm px-2 py-1.5 rounded-md border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"></select>
        <select id="score-filter" class="flex-shrink-0 text-sm px-2 py-1.5 rounded-md border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"></select>
      </div>
      <div id="date-filter" class="flex gap-1"></div>
    </div>
    <!-- 列表滚动区 -->
    <div class="flex-1 overflow-y-auto p-3 space-y-4">
    <section id="new-wrap" class="hidden">
      <h2 id="new-title" class="text-xs font-bold text-emerald-600 dark:text-emerald-400 mb-2 px-1"></h2>
      <div id="new-list" class="space-y-2"></div>
    </section>
    <section id="hist-wrap">
      <h2 id="hist-title" class="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2 px-1"></h2>
      <div id="hist-list" class="space-y-2"></div>
      <button id="hist-more" class="hidden mt-3 w-full py-2 text-xs text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-md"></button>
    </section>
    <p id="empty" class="hidden text-center text-gray-400 py-16 text-sm"></p>
    </div>
  </aside>

  <main id="detail-pane" class="flex-1 overflow-y-auto p-6">
    <div id="detail-content"></div>
  </main>
</div>

<!-- 运行监控：报告生成时的静态快照，不改变职位浏览主布局 -->
<div id="health-overlay" role="dialog" aria-modal="true" aria-labelledby="health-title"
  class="hidden fixed inset-0 z-50 overflow-y-auto bg-gray-900/95 p-4 sm:p-8">
  <div class="mx-auto max-w-5xl rounded-2xl border border-gray-700 bg-white dark:bg-gray-800 shadow-2xl">
    <div class="flex items-start gap-4 border-b border-gray-200 dark:border-gray-700 p-5 sm:p-6">
      <div class="min-w-0 flex-1">
        <h2 id="health-title" class="text-lg font-bold"></h2>
        <p id="health-subtitle" class="mt-1 text-xs text-gray-500 dark:text-gray-400"></p>
      </div>
      <button id="health-close" type="button" class="rounded-lg bg-gray-100 dark:bg-gray-700 px-3 py-1.5 text-xs hover:bg-gray-200 dark:hover:bg-gray-600"></button>
    </div>
    <div class="space-y-6 p-5 sm:p-6">
      <div id="health-window" class="inline-flex rounded-lg bg-gray-100 dark:bg-gray-900/60 p-1"></div>
      <div id="health-status-card" class="rounded-xl border p-4"></div>
      <section>
        <h3 id="health-kpi-title" class="mb-3 text-sm font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400"></h3>
        <div id="health-kpis" class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4"></div>
      </section>
      <section>
        <h3 id="health-breach-title" class="mb-3 text-sm font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400"></h3>
        <div id="health-breaches" class="space-y-2"></div>
      </section>
      <p id="health-snapshot" class="border-t border-gray-200 dark:border-gray-700 pt-4 text-xs text-gray-400 dark:text-gray-500"></p>
    </div>
  </div>
</div>

function t(key, ...args) {
  let s = (I18N[LANG] || I18N.en)[key] ?? (I18N.en[key] ?? key);
  args.forEach((v, i) => { s = s.replace(`{${i}}`, v); });
  return s;
}

// ── 状态 ───────────────────────────────────────────────────────────────────────
let sortMode = "score", scoreMin = null, dateRange = "all", searchText = "", histExpanded = false;
let selectedIdx = null;
let healthWindow = "7d";
const HIST_LIMIT = 20;

// ── 工具 ───────────────────────────────────────────────────────────────────────
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function scoreColor(s) {
  if (s == null) return "bg-gray-400";
  if (s >= 80) return "bg-green-500"; if (s >= 60) return "bg-yellow-400";
  if (s >= 40) return "bg-orange-400"; return "bg-red-400";
}
function scoreBadge(s, big) {
  const d = (s == null) ? "?" : Math.round(s);
  const sz = big ? "w-12 h-12 text-base" : "w-10 h-10 text-sm";
  return `<span class="inline-flex items-center justify-center ${sz} rounded-full text-white font-bold tabular-nums flex-shrink-0 ${scoreColor(s)}">${d}</span>`;
}
function recBadge(rec) {
  if (!rec) return "";
  const cls = {
    strong_apply: "bg-green-100 dark:bg-green-900/40 text-green-700 dark:text-green-300",
    apply: "bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300",
    stretch_apply: "bg-yellow-100 dark:bg-yellow-900/40 text-yellow-700 dark:text-yellow-300",
    low_priority: "bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300",
    skip: "bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300",
  }[rec] || "bg-gray-100 text-gray-600";
  return `<span class="px-2 py-0.5 rounded-full text-xs font-medium ${cls}">${t("rec_" + rec)}</span>`;
}
function chip(text, cls) { return `<span class="text-xs px-1.5 py-0.5 rounded ${cls}">${esc(text)}</span>`; }
function bullets(arr) {
  if (!arr || !arr.length) return `<p class="text-xs text-gray-400">${t("na")}</p>`;
  return `<ul class="text-xs space-y-1 list-disc list-inside">${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
}

// ── 运行健康快照 ────────────────────────────────────────────────────────────────
function healthSummary() {
  return (HEALTH && HEALTH[healthWindow]) || { status: "unavailable", metrics: {}, breaches: [] };
}
function healthStyle(status) {
  return {
    healthy: {
      button: "border-green-200 dark:border-green-800 bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300",
      dot: "bg-green-500", card: "border-green-200 dark:border-green-800 bg-green-50 dark:bg-green-900/20",
    },
    degraded: {
      button: "border-orange-200 dark:border-orange-800 bg-orange-50 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300",
      dot: "bg-orange-500", card: "border-orange-200 dark:border-orange-800 bg-orange-50 dark:bg-orange-900/20",
    },
    no_data: {
      button: "border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300",
      dot: "bg-gray-400", card: "border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/30",
    },
    unavailable: {
      button: "border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300",
      dot: "bg-gray-400", card: "border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/30",
    },
  }[status] || healthStyle("unavailable");
}
function healthStatusText(status) { return t("health_" + status); }
function fmtNumber(value) { return value == null ? "–" : Number(value).toLocaleString(); }
function fmtPercent(value) { return value == null ? "–" : `${(Number(value) * 100).toFixed(1)}%`; }
function fmtMs(value) { return value == null ? "–" : t("health_ms", fmtNumber(value)); }
function fmtMinutes(value) { return value == null ? "–" : t("health_minutes", fmtNumber(value)); }
function formatBreachValue(metric, value) {
  if (["conflict_rate", "rejected_rate", "evaluation_success_rate"].includes(metric)) return fmtPercent(value);
  if (metric === "lock_wait_p95_ms") return fmtMs(value);
  if (metric === "oldest_pending_age_minutes") return fmtMinutes(value);
  return fmtNumber(value);
}
function renderHealthButton() {
  const summary = healthSummary();
  const style = healthStyle(summary.status);
  const button = document.getElementById("health-btn");
  button.className = `inline-flex items-center gap-1.5 text-xs px-2 py-1 rounded-md border transition-colors ${style.button}`;
  document.getElementById("health-dot").className = `w-2 h-2 rounded-full ${style.dot}`;
  document.getElementById("health-label").textContent = healthStatusText(summary.status);
  button.setAttribute("aria-label", `${t("health_title")}: ${healthStatusText(summary.status)}`);
}
function renderHealthOverlay() {
  const summary = healthSummary();
  const metrics = summary.metrics || {};
  const queue = metrics.queue || {};
  const breaches = Array.isArray(summary.breaches) ? summary.breaches : [];
  const style = healthStyle(summary.status);
  document.getElementById("health-title").textContent = t("health_title");
  document.getElementById("health-subtitle").textContent = t("health_subtitle");
  document.getElementById("health-close").textContent = t("health_close");
  document.getElementById("health-window").innerHTML = ["7d", "30d"].map(windowName =>
    `<button type="button" data-health-window="${windowName}" class="rounded-md px-3 py-1.5 text-xs ${healthWindow === windowName ? "bg-blue-600 text-white shadow-sm" : "text-gray-600 dark:text-gray-300 hover:bg-white dark:hover:bg-gray-700"}">${t("health_" + windowName)}</button>`
  ).join("");

  const description = summary.status === "degraded"
    ? t("health_degraded_desc", breaches.length)
    : t(`health_${summary.status}_desc`);
  const statusCard = document.getElementById("health-status-card");
  statusCard.className = `rounded-xl border p-4 ${style.card}`;
  statusCard.innerHTML = `<div class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full ${style.dot}"></span><strong class="text-sm">${esc(healthStatusText(summary.status))}</strong></div><p class="mt-1.5 text-xs text-gray-600 dark:text-gray-300">${esc(description)}</p>`;

  const kpis = [
    ["health_events", fmtNumber(metrics.events_total)],
    ["health_failed", fmtNumber(metrics.failed_events)],
    ["health_success", fmtPercent(metrics.evaluation_success_rate)],
    ["health_rejected", fmtPercent(metrics.rejected_rate)],
    ["health_conflicts", fmtPercent(metrics.conflict_rate)],
    ["health_cache", fmtPercent(metrics.cache_hit_rate)],
    ["health_new_jobs", fmtNumber(metrics.newly_added)],
    ["health_duration", fmtMs((metrics.duration_ms || {}).p95)],
    ["health_lock", fmtMs((metrics.lock_wait_ms || {}).p95)],
    ["health_active", fmtNumber(queue.active_runs)],
    ["health_pending", fmtNumber(queue.pending_tasks)],
    ["health_oldest", fmtMinutes(queue.oldest_pending_age_minutes)],
  ];
  document.getElementById("health-kpi-title").textContent = t("health_kpis");
  document.getElementById("health-kpis").innerHTML = kpis.map(([label, value]) =>
    `<div class="rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/30 p-3"><p class="text-xs text-gray-500 dark:text-gray-400">${esc(t(label))}</p><p class="mt-1 font-mono text-sm font-semibold tabular-nums">${esc(value)}</p></div>`
  ).join("");

  document.getElementById("health-breach-title").textContent = `${t("health_breaches")} (${breaches.length})`;
  document.getElementById("health-breaches").innerHTML = breaches.length ? breaches.map(breach => {
    const label = t("health_metric_" + breach.metric);
    const comparison = t("health_" + breach.comparison);
    const detail = t("health_breach_rule", formatBreachValue(breach.metric, breach.value), comparison, formatBreachValue(breach.metric, breach.threshold));
    return `<div class="rounded-lg border border-orange-200 dark:border-orange-800 bg-orange-50 dark:bg-orange-900/20 px-3 py-2"><p class="text-xs font-semibold text-orange-700 dark:text-orange-300">${esc(label)}</p><p class="mt-0.5 font-mono text-xs text-gray-600 dark:text-gray-300">${esc(detail)}</p></div>`;
  }).join("") : `<p class="rounded-lg border border-gray-200 dark:border-gray-700 px-3 py-3 text-xs text-gray-500 dark:text-gray-400">${t("health_none")}</p>`;

  const generated = new Date(summary.generated_at);
  const generatedText = Number.isNaN(generated.getTime()) ? "–" : generated.toLocaleString(LANG === "zh" ? "zh-CN" : "en-IE");
  document.getElementById("health-snapshot").textContent = t("health_snapshot", generatedText);
}

// ── 筛选 / 排序 ─────────────────────────────────────────────────────────────────
function withinDate(job) {
  if (dateRange === "all") return true;
  const ds = job.date_posted || job.first_seen;
  if (!ds) return true;
  const d = new Date(ds); if (isNaN(d)) return true;
  const days = (Date.now() - d.getTime()) / 86400000;
  return dateRange === "today" ? days <= 1 : days <= 7;
}
function matches(job) {
  if (searchText) {
    const q = searchText.toLowerCase();
    if (!(job.title || "").toLowerCase().includes(q) && !(job.company || "").toLowerCase().includes(q)) return false;
  }
  if (scoreMin != null && (job.score ?? -1) < scoreMin) return false;
  if (!withinDate(job)) return false;
  return true;
}
function sortJobs(list) {
  return [...list].sort((a, b) =>
    sortMode === "score" ? (b.score ?? -1) - (a.score ?? -1)
      : new Date(b.date_posted || b.first_seen || 0) - new Date(a.date_posted || a.first_seen || 0));
}

// ── 左栏卡片（精简）──────────────────────────────────────────────────────────────
function sourceChips(job) {
  return (job.sources || []).map(s => {
    const k = (s || "").toLowerCase();
    const cls = k.includes("linkedin") ? "bg-blue-600/10 text-blue-600 dark:text-blue-400"
      : k.includes("greenhouse") || k.includes("lever") ? "bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400"
        : "bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400";
    return chip(s, cls);
  }).join(" ");
}
function card(job, idx) {
  const isNew = job.status === "new";
  const sel = idx === selectedIdx ? "selected ring-1 ring-blue-300 dark:ring-blue-700" : "";
  return `
  <div data-idx="${idx}" class="job-card card-enter bg-white dark:bg-gray-800 rounded-lg border border-gray-100 dark:border-gray-700 p-2.5 hover:shadow-md cursor-pointer ${sel}" onclick="selectJob(${idx})">
    <div class="flex items-start gap-2.5">
      ${scoreBadge(job.score)}
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span class="font-medium text-sm truncate">${esc(job.title)}</span>
          ${isNew ? `<span class="text-[10px] font-semibold px-1 py-0.5 bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400 rounded">NEW</span>` : ""}
        </div>
        <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 truncate">${esc(job.company)}${job.location ? " · " + esc(job.location) : ""}</div>
        <div class="mt-1">${recBadge(job.recommendation)}</div>
      </div>
    </div>
  </div>`;
}

// ── 右栏详情 ────────────────────────────────────────────────────────────────────
function renderDetail(job) {
  const pane = document.getElementById("detail-content");
  if (!job) {
    pane.innerHTML = `<div class="h-full flex items-center justify-center text-gray-400 text-sm">${t("select_hint")}</div>`;
    return;
  }
  const jd = job.jd || {};
  const dim = (k, v) => `<div class="flex justify-between"><span class="text-gray-500">${t("dim_" + k)}</span><span class="font-mono">${v == null ? "–" : Math.round(v)}</span></div>`;
  const sourceLinks = (job.source_urls || []).map(su =>
    `<a href="${esc(su.url)}" target="_blank" class="text-xs px-2 py-0.5 rounded bg-gray-100 dark:bg-gray-700 text-blue-600 dark:text-blue-400 hover:underline">${esc(su.source)}</a>`).join(" ");
  const flags = [];
  if (job.verified === "unverified") flags.push(chip(t("unverified"), "bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400"));
  if (job.scored_from === "snippet") flags.push(chip(t("from_snippet"), "bg-gray-100 dark:bg-gray-700 text-gray-500"));
  if (job.possibly_closed) flags.push(chip(t("closed"), "bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400"));
  if (job.stale_score && job.score == null) flags.push(chip(t("stale_score"), "bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400"));

  pane.innerHTML = `
    <div class="max-w-3xl card-enter">
      <div class="flex items-start gap-3 mb-4">
        ${scoreBadge(job.score, true)}
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-lg leading-tight">${esc(job.title)}</h3>
          <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">${esc(job.company)}${job.location ? " · " + esc(job.location) : ""}${job.salary ? " · " + esc(job.salary) : ""}</p>
          <div class="flex items-center gap-1.5 mt-2 flex-wrap">${recBadge(job.recommendation)}${flags.join(" ")}</div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 mb-4 flex-wrap">
        ${(job.matched_keywords || []).map(k => chip(k, "bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-300")).join(" ")}
        ${sourceChips(job)}
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="bg-gray-50 dark:bg-gray-900/40 rounded-xl p-4">
          <h4 class="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">${t("d_breakdown")}</h4>
          <div class="space-y-1.5 text-xs">
            ${dim("title", job.title_score)}${dim("seniority", job.seniority_score)}${dim("skills", job.skills_score)}${dim("location", job.location_score)}${dim("must", job.must_have_score)}
          </div>
        </div>
        <div class="space-y-3">
          <div class="bg-green-50 dark:bg-green-900/20 rounded-xl p-4">
            <h4 class="text-xs font-bold text-green-700 dark:text-green-400 mb-1.5">${t("d_strengths")}</h4>${bullets(job.strengths)}
          </div>
          <div class="bg-orange-50 dark:bg-orange-900/20 rounded-xl p-4">
            <h4 class="text-xs font-bold text-orange-700 dark:text-orange-400 mb-1.5">${t("d_weak")}</h4>${bullets(job.weaknesses)}
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <div><h4 class="text-xs font-bold text-gray-500 mb-1.5">${t("d_musthave")}</h4>${bullets(jd.must_have || jd.must_have_requirements)}</div>
        <div><h4 class="text-xs font-bold text-gray-500 mb-1.5">${t("d_good")}</h4>${bullets(jd.good_to_have)}</div>
      </div>

      <div class="mt-5 pt-4 border-t border-gray-100 dark:border-gray-700 flex items-center gap-2 flex-wrap">
        <span class="text-xs text-gray-400">${t("sources")}:</span> ${sourceLinks}
        <a href="${esc(job.url)}" target="_blank" class="ml-auto px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded-lg">${t("apply")}</a>
      </div>
    </div>`;
}

function selectJob(idx) {
  selectedIdx = idx;
  document.querySelectorAll(".job-card").forEach(el => {
    const on = +el.dataset.idx === idx;
    el.classList.toggle("selected", on);
    el.classList.toggle("ring-1", on);
    el.classList.toggle("ring-blue-300", on);
    el.classList.toggle("dark:ring-blue-700", on);
  });
  renderDetail(idx == null ? null : JOBS[idx]);
}

// ── 渲染列表 ────────────────────────────────────────────────────────────────────
function renderList() {
  const filtered = sortJobs(JOBS.filter(matches));
  const idxOf = j => JOBS.indexOf(j);
  const news = filtered.filter(j => j.status === "new");
  const hist = filtered.filter(j => j.status !== "new");

  const newWrap = document.getElementById("new-wrap");
  if (news.length) {
    newWrap.classList.remove("hidden");
    document.getElementById("new-title").textContent = t("new_title", news.length);
    document.getElementById("new-list").innerHTML = news.map(j => card(j, idxOf(j))).join("");
  } else newWrap.classList.add("hidden");

  document.getElementById("hist-title").textContent = t("hist_title", hist.length);
  const shown = histExpanded ? hist : hist.slice(0, HIST_LIMIT);
  document.getElementById("hist-list").innerHTML = shown.map(j => card(j, idxOf(j))).join("");
  const moreBtn = document.getElementById("hist-more");
  if (!histExpanded && hist.length > HIST_LIMIT) {
    moreBtn.classList.remove("hidden");
    moreBtn.textContent = t("more", hist.length - HIST_LIMIT);
  } else moreBtn.classList.add("hidden");

  document.getElementById("empty").classList.toggle("hidden", filtered.length > 0);

  // 选中：保持当前选中（若仍可见），否则选第一个
  const visible = filtered.map(idxOf);
  if (selectedIdx == null || !visible.includes(selectedIdx)) {
    selectJob(visible.length ? visible[0] : null);
  } else {
    selectJob(selectedIdx);
  }
}

// ── 控件 ───────────────────────────────────────────────────────────────────────
function applyStaticLabels() {
  document.documentElement.lang = LANG;
  document.getElementById("summary").textContent = t("summary", META.new_count ?? 0, META.cached_count ?? 0, JOBS.length);
  document.getElementById("profile-line").textContent = META.profile_summary ? t("profile", META.profile_summary) : "";
  document.getElementById("search").placeholder = t("search_ph");
  document.getElementById("lang-btn").textContent = t("lang_btn");
  document.getElementById("dark-btn").textContent = document.documentElement.classList.contains("dark") ? t("dark_light") : t("dark_dark");
  const sortSel = document.getElementById("sort");
  sortSel.innerHTML = `<option value="score">${t("sort_score")}</option><option value="date">${t("sort_date")}</option>`;
  sortSel.value = sortMode;
  document.getElementById("date-filter").innerHTML = ["all", "today", "week"].map(r =>
    `<button data-r="${r}" class="text-xs px-2 py-1.5 rounded-md ${dateRange === r ? "bg-blue-500 text-white" : "bg-gray-100 dark:bg-gray-700"}">${t("f_" + r)}</button>`).join("");
  const sf = document.getElementById("score-filter");
  sf.innerHTML = `<option value="">${t("score_all")}</option>` + [50, 70, 85].map(n => `<option value="${n}">${t("score_n", n)}</option>`).join("");
  sf.value = scoreMin ?? "";
  renderHealthButton();
  if (!document.getElementById("health-overlay").classList.contains("hidden")) renderHealthOverlay();
}
function bind() {
  document.getElementById("search").addEventListener("input", e => { searchText = e.target.value.trim(); renderList(); });
  document.getElementById("sort").addEventListener("change", e => { sortMode = e.target.value; renderList(); });
  document.getElementById("score-filter").addEventListener("change", e => { scoreMin = e.target.value ? +e.target.value : null; renderList(); });
  document.getElementById("date-filter").addEventListener("click", e => {
    const b = e.target.closest("[data-r]"); if (!b) return;
    dateRange = b.dataset.r; applyStaticLabels(); renderList();
  });
  document.getElementById("hist-more").addEventListener("click", () => { histExpanded = true; renderList(); });
  document.getElementById("lang-btn").addEventListener("click", () => { LANG = LANG === "zh" ? "en" : "zh"; applyStaticLabels(); renderList(); });
  document.getElementById("health-btn").addEventListener("click", () => {
    document.getElementById("health-overlay").classList.remove("hidden");
    renderHealthOverlay();
  });
  document.getElementById("health-close").addEventListener("click", () => document.getElementById("health-overlay").classList.add("hidden"));
  document.getElementById("health-window").addEventListener("click", e => {
    const button = e.target.closest("[data-health-window]"); if (!button) return;
    healthWindow = button.dataset.healthWindow;
    renderHealthButton(); renderHealthOverlay();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") document.getElementById("health-overlay").classList.add("hidden");
  });
  document.getElementById("dark-btn").addEventListener("click", () => {
    const on = document.documentElement.classList.toggle("dark");
    localStorage.setItem("jm_dark", on ? "1" : "0");
    applyStaticLabels();
  });
}
(function init() {
  const saved = localStorage.getItem("jm_dark");
  if (saved !== null) document.documentElement.classList.toggle("dark", saved === "1");
  if (!["zh", "en"].includes(LANG)) LANG = "en";
  applyStaticLabels(); bind(); renderList();
})();
</script>
</body>
</html>
